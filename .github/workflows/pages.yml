name: Deploy site

# GitHub Pages serves the gh-pages branch. This builds the game and commits the result there.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      - name: Check out the published branch
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: published

      - name: Publish the built site to the gh-pages branch
        run: |
          rsync -a --delete --exclude .git --exclude .nojekyll dist/ published/
          cd published
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The built site has not changed; nothing to publish."
            exit 0
          fi
          git commit -q -m "Built site for ${GITHUB_SHA::7}"
          git push
